<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Funancial — Direction A: Calm Fintech</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; background: #d9dde6; color: #0f172a; padding: 24px 16px 48px; }
  .intro { max-width: 790px; margin: 0 auto 20px; }
  .intro h1 { font-size: 22px; font-weight: 800; }
  .intro p { color: #475569; margin-top: 4px; font-size: 14px; line-height: 1.5; }
  .stage { display: flex; flex-wrap: wrap; gap: 32px; justify-content: center; }
  .caption { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: #475569; margin-bottom: 8px; text-align: center; }

  [data-theme="light"] {
    --bg: #F6F7FB; --surface: #FFFFFF; --surface-2: #EEF1F7; --text: #0F172A; --muted: #5B6478; --border: #E3E7EF;
    --primary: #2453D6; --on-primary: #FFFFFF; --xp: #6D5BD0; --success: #0E8A5F; --warning: #B45309; --danger: #DC2626; --shadow: 0 1px 2px rgba(15,23,42,.06), 0 4px 16px rgba(15,23,42,.05);
  }
  [data-theme="dark"] {
    --bg: #0B1020; --surface: #131A2E; --surface-2: #1A2340; --text: #E8ECF6; --muted: #98A2BD; --border: #26304D;
    --primary: #7EA2FF; --on-primary: #0B1020; --xp: #A99BFF; --success: #3DD39A; --warning: #F5B54A; --danger: #F87171; --shadow: none;
  }

  .phone { width: 375px; height: 812px; border-radius: 44px; overflow: hidden; position: relative; background: var(--bg); color: var(--text);
    border: 10px solid #111827; box-shadow: 0 20px 50px rgba(0,0,0,.25); }
  .screen { height: 100%; overflow: auto; scrollbar-width: none; padding: 18px 18px 110px; display: flex; flex-direction: column; gap: 14px; }
  .num { font-variant-numeric: tabular-nums; }

  .top { display: flex; align-items: center; justify-content: space-between; padding-top: 8px; }
  .who { display: flex; align-items: center; gap: 10px; }
  .avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--surface-2); display: grid; place-items: center; color: var(--xp); font-weight: 800; border: 2px solid var(--xp); font-size: 15px; }
  .greet { font-size: 13px; color: var(--muted); }
  .level { font-size: 15px; font-weight: 700; }
  .streak { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; background: var(--surface); border: 1px solid var(--border); padding: 7px 11px; border-radius: 999px; color: var(--warning); }
  .streak svg { width: 16px; height: 16px; }

  .xp { display: flex; align-items: center; gap: 10px; }
  .xp-bar { flex: 1; height: 8px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
  .xp-bar span { display: block; height: 100%; background: var(--xp); border-radius: 99px; }
  .xp-label { font-size: 12px; color: var(--muted); font-weight: 600; }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 16px; box-shadow: var(--shadow); }
  .label { font-size: 13px; color: var(--muted); font-weight: 600; }
  .big { font-size: 34px; font-weight: 800; letter-spacing: -.02em; margin-top: 4px; }
  .row { display: flex; align-items: baseline; gap: 8px; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border); font-size: 14px; }
  .row span:first-child { color: var(--muted); }
  .up { margin-left: auto; color: var(--success); font-weight: 700; font-size: 13px; }

  h3 { font-size: 15px; font-weight: 700; margin-bottom: 12px; display: flex; justify-content: space-between; }
  h3 a { font-size: 13px; color: var(--primary); text-decoration: none; font-weight: 600; }
  .limit + .limit { margin-top: 14px; }
  .limit-top { display: flex; justify-content: space-between; font-size: 14px; }
  .limit-top span:last-child { color: var(--muted); }
  .bar { height: 8px; border-radius: 99px; background: var(--surface-2); margin-top: 8px; overflow: hidden; }
  .bar span { display: block; height: 100%; border-radius: 99px; background: var(--primary); }
  .warn .bar span { background: var(--warning); }
  .note { font-size: 12px; color: var(--warning); margin-top: 6px; font-weight: 600; }

  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .action { font: inherit; font-weight: 700; font-size: 14px; border-radius: 12px; padding: 14px 12px; display: flex; align-items: center; gap: 8px; justify-content: center; cursor: pointer;
    background: var(--surface); color: var(--text); border: 1px solid var(--border); }
  .action.primary { background: var(--primary); color: var(--on-primary); border-color: var(--primary); }
  .action svg { width: 18px; height: 18px; }

  .quest { display: flex; align-items: center; gap: 12px; }
  .quest .ico { width: 36px; height: 36px; border-radius: 10px; background: var(--surface-2); color: var(--xp); display: grid; place-items: center; }
  .quest .ico svg { width: 18px; height: 18px; }
  .quest .t { font-size: 14px; font-weight: 600; }
  .quest .s { font-size: 12px; color: var(--muted); }
  .quest .xp-chip { margin-left: auto; font-size: 12px; font-weight: 700; color: var(--xp); background: var(--surface-2); border-radius: 99px; padding: 4px 9px; }

  .tabs { position: absolute; left: 0; right: 0; bottom: 0; height: 84px; background: var(--surface); border-top: 1px solid var(--border); display: flex; justify-content: space-around; padding: 10px 6px 24px; }
  .tab { display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11px; font-weight: 600; color: var(--muted); width: 64px; }
  .tab svg { width: 22px; height: 22px; }
  .tab.on { color: var(--primary); }
  .fab { position: absolute; right: 18px; bottom: 100px; width: 56px; height: 56px; border-radius: 18px; background: var(--primary); color: var(--on-primary); display: grid; place-items: center; box-shadow: 0 8px 20px rgba(36,83,214,.35); border: 0; }
  .fab svg { width: 26px; height: 26px; }
  svg { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
</style>
</head>
<body>
  <div class="intro">
    <h1>A — Calm fintech</h1>
    <p>Neutral slate surfaces, one trustworthy blue, a quiet violet for XP. The game layer is present but understated — it feels like a serious money app first. Font: Plus Jakarta Sans.</p>
  </div>
  <div class="stage">
    <div><div class="caption">Light</div><div class="phone" data-theme="light"></div></div>
    <div><div class="caption">Dark</div><div class="phone" data-theme="dark"></div></div>
  </div>

<template id="screen">
  <div class="screen">
    <header class="top">
      <div class="who">
        <div class="avatar">12</div>
        <div><div class="greet">Good evening</div><div class="level">Silver Budgeter</div></div>
      </div>
      <div class="streak"><svg viewBox="0 0 24 24"><path d="M12 3c1 3 5 5 5 10a5 5 0 0 1-10 0c0-2 1-3.5 2-4.5 0 2 1 3 2 3 0-3-1-5 1-8.5z"/></svg>9 days</div>
    </header>
    <div class="xp"><div class="xp-bar"><span style="width:69%"></span></div><div class="xp-label num">1,240 / 1,800 XP</div></div>

    <section class="card">
      <div class="label">Available balance</div>
      <div class="big num">$3,482.15</div>
      <div class="row"><span>Net worth</span><strong class="num">$24,960.40</strong><span class="up num">+$312 this month</span></div>
    </section>

    <section class="card">
      <h3>Limits <a href="#">See all</a></h3>
      <div class="limit warn">
        <div class="limit-top"><span>Food · this week</span><span class="num">$102 of $120</span></div>
        <div class="bar"><span style="width:85%"></span></div>
        <div class="note">85% used · 3 days left this week</div>
      </div>
      <div class="limit">
        <div class="limit-top"><span>Overall · October</span><span class="num">$1,214 of $2,600</span></div>
        <div class="bar"><span style="width:47%"></span></div>
      </div>
    </section>

    <div class="actions">
      <button class="action primary"><svg viewBox="0 0 24 24"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg>Add expense</button>
      <button class="action"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .8-1 1.5v.7"/><path d="M12 17h.01"/></svg>Should I buy it?</button>
    </div>

    <section class="card quest">
      <div class="ico"><svg viewBox="0 0 24 24"><path d="M8 4h8v5a4 4 0 0 1-8 0z"/><path d="M8 6H5a3 3 0 0 0 3 4M16 6h3a3 3 0 0 1-3 4"/><path d="M12 13v4M8 20h8"/></svg></div>
      <div><div class="t">Log today's expenses</div><div class="s">Daily quest · 2 of 3 done</div></div>
      <div class="xp-chip">+20 XP</div>
    </section>

    <button class="fab" aria-label="Quick add"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
    <nav class="tabs">
      <div class="tab on"><svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Home</div>
      <div class="tab"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 3v9h9"/></svg>Budget</div>
      <div class="tab"><svg viewBox="0 0 24 24"><path d="m3 17 6-6 4 4 8-8"/><path d="M14 7h7v7"/></svg>Invest</div>
      <div class="tab"><svg viewBox="0 0 24 24"><path d="M6 7h12l-1 13H7z"/><path d="M9 7a3 3 0 0 1 6 0"/></svg>Buy It?</div>
      <div class="tab"><svg viewBox="0 0 24 24"><path d="M8 4h8v5a4 4 0 0 1-8 0z"/><path d="M8 6H5a3 3 0 0 0 3 4M16 6h3a3 3 0 0 1-3 4"/><path d="M12 13v4M8 20h8"/></svg>Quests</div>
    </nav>
  </div>
</template>
<script>
  document.querySelectorAll('.phone').forEach((p) => p.appendChild(document.getElementById('screen').content.cloneNode(true)));
</script>
</body>
</html>
