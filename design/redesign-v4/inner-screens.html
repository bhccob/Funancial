<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Inner screens</title>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400..800&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter Tight', system-ui, sans-serif; background: #e6e6e9; color: #0b0b0c; -webkit-font-smoothing: antialiased; padding: 28px 16px 60px; }
  h1 { font-size: 26px; font-weight: 800; letter-spacing: -.02em; }
  .lead { color: #55555c; margin-top: 8px; max-width: 86ch; line-height: 1.5; font-size: 15px; }
  .grp { margin-top: 26px; cursor: pointer; border-radius: 26px; padding: 12px; }
  .grp.selected { box-shadow: 0 0 0 4px #7c5cff; background: rgba(124,92,255,.06); }
  .grp > b { display: block; font-size: 16px; font-weight: 800; margin: 0 4px 2px; }
  .grp > small { display: block; font-size: 13px; color: #55555c; margin: 0 4px 12px; }
  .row { display: flex; flex-wrap: wrap; gap: 22px; align-items: flex-start; }
  .phone { position: relative; width: 300px; height: 620px; border-radius: 42px; overflow: hidden; isolation: isolate; background: #eeeef0;
    box-shadow: 0 0 0 8px #0d0d10, 0 0 0 9px #2a2a30, 0 26px 44px -28px rgba(0,0,0,.5); }
  .phone::before { content: ''; position: absolute; inset: 0; z-index: -1; background: radial-gradient(40% 18% at 88% 46%, rgba(20,20,26,.07), transparent 70%), radial-gradient(42% 18% at 8% 66%, rgba(255,255,255,.95), transparent 70%); }
  .phone > i.cap { position: absolute; top: -26px; left: 0; right: 0; text-align: center; font-size: 12px; font-weight: 800; color: #6a6a72; font-style: normal; letter-spacing: .05em; text-transform: uppercase; }
  .wrap { display: flex; flex-direction: column; align-items: center; gap: 0; padding-top: 26px; position: relative; }
  .wrap > span { font-size: 12px; font-weight: 800; color: #6a6a72; letter-spacing: .05em; text-transform: uppercase; margin-bottom: 8px; }
  svg.ic { width: var(--s, 18px); height: var(--s, 18px); flex: none; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .status { height: 38px; display: flex; justify-content: space-between; align-items: center; padding: 6px 26px 0; font-weight: 700; font-size: 12px; }
  .status i { width: 80px; height: 24px; border-radius: 20px; background: #000; display: block; }
  .head { position: relative; border-radius: 0 0 30px 30px; padding-bottom: 16px; color: #fff; overflow: hidden;
    background: radial-gradient(38% 30% at 18% 18%, rgba(255,255,255,.28), transparent 70%), radial-gradient(42% 38% at 92% 46%, rgba(170,170,185,.32), transparent 70%), linear-gradient(180deg,#141416,#050506); }
  .hg { background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.2); box-shadow: inset 0 1px 0 rgba(255,255,255,.22); }
  .pg { background: rgba(255,255,255,.48); border: 1px solid rgba(255,255,255,.85); box-shadow: inset 0 1px 0 #fff, 0 12px 28px -18px rgba(0,0,0,.35); }
  .bar { display: flex; align-items: center; gap: 10px; padding: 4px 16px 0; }
  .round { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; }
  .title { font-size: 24px; font-weight: 800; letter-spacing: -.03em; }
  .plain-title { padding: 4px 18px 6px; display: flex; align-items: center; gap: 10px; }
  .body { padding: 6px 14px 0; }
  .sec-h { font-size: 15px; font-weight: 800; margin: 16px 4px 6px; }
  .list { padding: 0 2px; }
  .r { display: flex; align-items: center; gap: 11px; min-height: 52px; padding: 7px 0; }
  .r + .r { border-top: 1px solid rgba(0,0,0,.07); }
  .r .ico { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: rgba(255,255,255,.72); border: 1px solid #fff; flex: none; }
  .r b { display: block; font-size: 13.5px; font-weight: 800; } .r small { font-size: 11.5px; font-weight: 600; color: #5a5a6c; }
  .r .end { margin-left: auto; font-size: 13px; font-weight: 800; display: flex; align-items: center; gap: 4px; color: #0b0b0c; }
  .sw { width: 40px; height: 24px; border-radius: 99px; background: #0b0b0c; position: relative; } .sw::after { content: ''; position: absolute; right: 3px; top: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; }
  .sw.off { background: #5a5a6c; } .sw.off::after { left: 3px; right: auto; }
  .pillbtn { display: inline-flex; align-items: center; gap: 5px; min-height: 32px; padding: 0 12px; border-radius: 99px; font-size: 12px; font-weight: 800; }
  .sheet { position: absolute; left: 0; right: 0; bottom: 0; top: 150px; border-radius: 28px 28px 0 0; background: rgba(255,255,255,.9); backdrop-filter: blur(24px); border-top: 1px solid #fff; padding: 8px 16px; }
  .grab { width: 38px; height: 5px; border-radius: 3px; background: rgba(0,0,0,.18); margin: 0 auto 10px; }
  .sheet h4 { font-size: 17px; font-weight: 800; }
  .amt { font-size: 38px; font-weight: 700; letter-spacing: -.04em; margin: 10px 0 2px; } .amt span { font-size: 15px; opacity: .6; margin-right: 4px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .chips span { min-height: 32px; padding: 0 11px; border-radius: 99px; display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 800; }
  .chips span.on { background: #0b0b0c; color: #fff; border-color: #0b0b0c; }
  .field { display: flex; align-items: center; justify-content: space-between; min-height: 46px; border-bottom: 1px solid rgba(0,0,0,.07); font-size: 13.5px; font-weight: 700; }
  .field small { font-size: 12px; color: #5a5a6c; font-weight: 700; }
  .save { margin-top: 14px; width: 100%; min-height: 46px; border-radius: 99px; background: linear-gradient(180deg, rgba(255,255,255,.3), rgba(255,255,255,0) 35%), #0b0b0c; color: #fff; font-weight: 800; font-size: 14px; display: grid; place-items: center; }
  .scrim { position: absolute; inset: 0; background: rgba(0,0,0,.28); }
</style>
</head>
<body>
  <h1>How should the other screens look?</h1>
  <p class="lead">Settings, Bills &amp; cards and the Add expense form, in the same style as Home and Profile: plain rows with thin lines, glass only on buttons, pills and icons, no boxes. The two rows differ only at the top. Tap the row you like (or tell me in the chat).</p>
  <div id="out"></div>
<script>
const I = {
  back:'<path d="m15 18-6-6 6-6"/>', right:'<path d="m9 18 6-6-6-6"/>', plus:'<path d="M5 12h14"/><path d="M12 5v14"/>',
  sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/>',
  bell:'<path d="M10.268 21a2 2 0 0 0 3.464 0"/><path d="M3.262 15.326A1 1 0 0 0 4 17h16a1 1 0 0 0 .74-1.673C19.41 13.956 18 12.499 18 8A6 6 0 0 0 6 8c0 4.499-1.411 5.956-2.738 7.326"/>',
  lock:'<rect width="18" height="11" x="3" y="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>', user:'<circle cx="12" cy="8" r="5"/><path d="M20 21a8 8 0 0 0-16 0"/>',
  db:'<ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5V19A9 3 0 0 0 21 19V5"/><path d="M3 12A9 3 0 0 0 21 12"/>', globe:'<circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/>',
  tv:'<rect width="20" height="15" x="2" y="7" rx="2"/><polyline points="17 2 12 7 7 2"/>', phone:'<rect width="14" height="20" x="5" y="2" rx="2"/><path d="M12 18h.01"/>',
  music:'<path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>', house:'<path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
  card:'<rect width="20" height="14" x="2" y="5" rx="2"/><line x1="2" x2="22" y1="10" y2="10"/>', food:'<path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/><path d="M7 2v20"/><path d="M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 3 2h2Zm0 0v7"/>',
  cart:'<circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/>', fuel:'<line x1="3" x2="15" y1="22" y2="22"/><path d="M14 22V4a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v18"/>',
};
const ic = (n, s = 18) => `<svg class="ic" viewBox="0 0 24 24" style="--s:${s}px">${I[n]}</svg>`;
const status = (dark) => `<div class="status" style="color:${dark ? '#fff' : '#0b0b0c'}"><span>9:41</span><i></i><span>100%</span></div>`;
function topBar(title, block, action = '') {
  return block
    ? `<div class="head">${status(true)}<div class="bar"><span class="round hg">${ic('back', 19)}</span><span class="title">${title}</span><span style="margin-left:auto">${action}</span></div></div>`
    : `${status(false)}<div class="plain-title"><span class="round pg">${ic('back', 19)}</span><span class="title">${title}</span><span style="margin-left:auto">${action}</span></div>`;
}
const row = (i, b, s, end) => `<div class="r"><span class="ico">${ic(i, 16)}</span><div><b>${b}</b>${s ? `<small>${s}</small>` : ''}</div><span class="end">${end}</span></div>`;

function settings(block) {
  return `${topBar('Settings', block)}<div class="body">
    <div class="sec-h">You</div><div class="list">${row('user', 'Profile', 'Name, avatar', ic('right', 15))}${row('globe', 'Currency', 'AWG · Aruban florin', ic('right', 15))}</div>
    <div class="sec-h">App</div><div class="list">${row('sun', 'Dark mode', 'Follow the phone', '<span class="sw off"></span>')}${row('bell', 'Reminders', 'Daily at 20:00', '<span class="sw"></span>')}${row('lock', 'Lock and security', 'PIN, fingerprint', ic('right', 15))}${row('db', 'Data', 'Account copy, delete', ic('right', 15))}</div></div>`;
}
function bills(block) {
  const btn = `<span class="pillbtn ${block ? 'hg' : 'pg'}" style="color:${block ? '#fff' : '#0b0b0c'}">${ic('plus', 14)}Add</span>`;
  return `${topBar('Bills', block, btn)}<div class="body">
    <div class="sec-h">This month · Afl. 1,590.40</div><div class="list">
    ${row('tv', 'Netflix', 'Main account · in 2 days', 'Afl. 31.50')}${row('phone', 'Phone', 'Visa credit · in 5 days', 'Afl. 89.00')}${row('music', 'Spotify', 'Main account · in 9 days', 'Afl. 19.90')}${row('house', 'Rent', 'Main account · in 12 days', 'Afl. 1,450')}</div>
    <div class="sec-h">Card payments</div><div class="list">${row('card', 'Visa credit', 'Pay in full · due the 25th', 'Afl. 240.00')}</div></div>`;
}
function add(block) {
  return `${topBar('Home', block)}<div class="scrim"></div><div class="sheet"><div class="grab"></div><h4>Add expense</h4>
    <div class="amt"><span>Afl.</span>12.50</div>
    <div class="chips"><span class="on">${ic('food', 14)}Food</span><span class="pg">${ic('cart', 14)}Shopping</span><span class="pg">${ic('fuel', 14)}Transport</span><span class="pg">${ic('house', 14)}Home</span></div>
    <div style="margin-top:10px"><div class="field">Paid with <small>Main account ·· 4312 ›</small></div><div class="field">Date <small>Today ›</small></div><div class="field">Note <small>Optional</small></div><div class="field">Repeat <small>Doesn’t repeat ›</small></div></div>
    <div class="save">Save expense</div></div>`;
}
const G = [
  ['a', 'A · A small dark block at the top of every screen', 'Each screen opens with a short version of the theme block (back button and title), so every screen clearly belongs to the same app. It changes colour with your theme.', true],
  ['b', 'B · Plain title on the light page', 'The big block stays on Home, Cards, Profile and the Shop only. Other screens have a plain title on the light page, with a glass back button.', false],
];
document.getElementById('out').innerHTML = G.map(([k, t, d, blk]) => `<div class="grp" data-choice="${k}" onclick="(window.toggleSelect||function(e){document.querySelectorAll('.grp').forEach(x=>x.classList.remove('selected'));e.classList.add('selected')})(this)"><b>${t}</b><small>${d}</small>
  <div class="row"><div class="wrap"><span>Settings</span><div class="phone">${settings(blk)}</div></div><div class="wrap"><span>Bills &amp; cards</span><div class="phone">${bills(blk)}</div></div><div class="wrap"><span>Add expense</span><div class="phone">${add(blk)}</div></div></div></div>`).join('');
</script>
</body>
</html>
