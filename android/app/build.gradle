apply plugin: 'com.android.application'

// The release key: android/keystore.properties (git-ignored; storeFile, storePassword, keyAlias,
// keyPassword) is made by the owner, see docs/release.md. keystoreProblem says why that file
// cannot sign, or is null when it can. Only a release task fails on it (see whenReady below):
// a missing, unreadable or incomplete file must never stop a debug build.
def keystoreFile = rootProject.file('keystore.properties')
def keystoreProps = new Properties()
def keystoreProblem = null
if (!keystoreFile.exists()) {
    keystoreProblem = 'does not exist'
} else {
    try {
        // Read as UTF-8, dropping a BOM. A UTF-16 file (PowerShell's > ) reads as no keys at all.
        keystoreProps.load(new StringReader(keystoreFile.getText('UTF-8').replaceFirst('^﻿', '')))
    } catch (Exception e) {
        keystoreProblem = "cannot be read (${e.message})"
    }
    def missing = ['storeFile', 'storePassword', 'keyAlias', 'keyPassword'].findAll {
        !keystoreProps.getProperty(it)?.trim()
    }
    if (keystoreProblem == null && missing) {
        keystoreProblem = "has no ${missing.join(', ')} (saved as UTF-16, or a key misspelled?)"
    } else if (keystoreProblem == null && !file(keystoreProps.getProperty('storeFile')).exists()) {
        keystoreProblem = "names a storeFile that does not exist: ${keystoreProps.getProperty('storeFile')} (use forward slashes)"
    }
}
gradle.taskGraph.whenReady { graph ->
    if (keystoreProblem != null && graph.allTasks.any { it.project == project && it.name.contains('Release') }) {
        throw new GradleException("Cannot sign the release build: android/keystore.properties ${keystoreProblem}. See docs/release.md.")
    }
}

android {
    namespace = "io.github.bhccob.funancial"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "io.github.bhccob.funancial"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 13
        versionName "0.13"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (keystoreProblem == null) {
                storeFile file(keystoreProps.getProperty('storeFile'))
                storePassword keystoreProps.getProperty('storePassword')
                keyAlias keystoreProps.getProperty('keyAlias')
                keyPassword keystoreProps.getProperty('keyPassword')
            }
        }
    }
    buildTypes {
        release {
            if (keystoreProblem == null) signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
